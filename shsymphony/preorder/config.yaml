# ============================================================
# 上海交响乐团 2026-27 预售套票(多场次) · 自动锁座配置
# 改完本文件后在根目录运行：  ./build.sh preorder
# 会生成 preorder.user.js —— 用油猴(Tampermonkey)安装一次即可；选场页一打开脚本即就绪。
# ============================================================

# 期望锁到的场次数（不同场数优惠档位不同）。
# 若主选实际锁到的场次数不足这个数，会自动按顺序从 backup 补足。
desiredSessions: 5

# 买 2 张及以上时，是否要求“连座”。
#   false = 不连座也接受（默认，抢到就行）
#   true  = 若系统给的是不连座，则自动释放并降级到下一个价位再试（更可能抢不到）
preferConnected: false

# 是否“开票即自动抢”。
#   false = 只挂好面板/快捷键，你手动点“一键抢票”或按 Alt+Shift+R（默认，稳妥）
#   true  = 选场页一加载好就自动执行 run()，全程零点击（专治开票后再操作太迟）
#           注意：会真实锁座；确认配置无误后再开。付款仍需你手动完成。
autoRun: true

# ------------------------------------------------------------
# 主选清单：数组顺序 = 锁座优先级（从上到下依次“确认锁座”）。
# 每个场次用 date（playTime 前缀）+ title（网页节目标题的子串）定位；
# 二者都填则须同时满足，可只填其一（date 用于区分同一天多场）。
#
# slots：本场要买的“票位槽”。每个槽是一条“降级链”，从左到右取第一个买得到的：
#   写法 "价格x张数"，如 "80x2" = 80元档买2张。
#
# 例（你给的例子，最想要 80元2张 + 180元1张；80没了→180共2张；180也没了→280×1+380×1）：
#   slots:
#     - ["80x2", "180x1", "280x1"]   # 槽1
#     - ["180x1", "380x1"]           # 槽2
#
# 注意：单场总张数不超过 maxBuyLimit（当前为 4）。链中不存在的价位会自动跳过。
# ------------------------------------------------------------
# 下面每场默认“1 张、从最低档往上买”，请按需改张数/加槽。
sessions:
  - date: "2027-06-18"
    title: "科恩戈尔德"                      # 余隆、卡瓦科斯（科恩戈尔德/马勒五）
    slots:
      - ["80x1", "180x1", "380x1",]

  - date: "2026-09-13"
    title: "第十"          # 余隆、卡瓦科斯（肖十）
    slots:
      - ["80x1", "180x1"]

  - date: "2026-10-23"
    title: "奥滕萨默"                        # 奥滕萨默、奥皮茨（莫扎特/理查·施特劳斯）
    slots:
      - ["80x1", "180x1"]

# ------------------------------------------------------------
# 备用清单：当成功场次数 < desiredSessions 时，按顺序补入直到达标。
# ------------------------------------------------------------
# 注意：多数场次 80 元档已售罄，若备用只写 80 就会凑不满场次数；
# 因此每个备用都带上更高价位的降级链（80 没了就退到 180/380）。
backup:
  - date: "2026-09-11"
    title: "开幕"                # 余隆、卡瓦科斯（肖一/肖第一小协）  80售罄→180余56
    slots:
      - ["80x1", "180x1", "380x1"]

  - date: "2026-09-25"
    title: "布兰诗歌"                        # 孙一凡（布兰诗歌）  80售罄→180余29
    slots:
      - ["80x1", "180x1", "380x1"]

  - date: "2027-01-20"
    title: "拉赫玛尼诺夫与周天"              # 余隆、卡瓦科斯、陆轶文  80余167
    slots:
      - ["80x1", "180x1", "380x1"]

  - date: "2027-04-29"
    title: "肖斯塔科维奇第二、第三"          # 余隆、音乐永恒合唱团  80售罄→180余75
    slots:
      - ["80x1", "180x1", "380x1"]
