# ============================================================
# 上海大剧院 · 单场“选座”页自动抢座配置
# 改完本文件后在目录里运行：  ./build.sh build
# 会生成 shgtheatre.user.js —— 用油猴(Tampermonkey)安装一次即可；选座页一打开脚本就自动就绪。
#
# 适用页面（登录后、进入某个场次的选座页）：
#   https://www.shgtheatre.com/shtheatre/index.html#/ticket/seats/<场次id>?pk=...&sk=...
#   打开方式：官网 → 在线购票 → 点开想看的演出 → 详情页点“选座购买/立即购买”→ 进入选座页。
#   运行时 scheduleId/pk/sk 全部自动从当前页面 URL 读取，一般无需在下面填写。
# ============================================================

# —— 开关 ——
dryRun: false           # true = 只预演(打印会挑哪几个座)，绝不真正下单；抢票时请保持 false
autoRun: true          # true = 选座页一加载好就自动抢座(零点击)；会真实锁座，付款仍需你手动
submitOrder: true       # true = 真正调用下单接口锁座；false = 只算好座位不提交(调试用)
maxRetry: 6             # 座位被别人抢走时，自动“刷新库存 → 重挑”的次数
jumpToConfirm: true     # 抢到后是否自动跳到确认页(离开选座页，面板会消失)
autoAdvanceToPay: true # 抢到后自动跳过确认页的“勾协议+确认支付”，直接弹出付款方式/二维码
                        # （只帮你点到二维码为止，绝不代付；要更省事就设 true）
mobile: ""              # 留空 = 自动用登录账号的手机号；需要覆盖时填 11 位手机号
certificationIds: []    # 实名场次(需身份证)用；留空 = 自动取账号里第一条实名信息
rowPreference: middle   # 同价位里的选排偏好：front(越前越好) / middle(中间排) / back(越后越好)

# —— 备选链 ——
# rules 是“有序备选链”：从上往下依次尝试，第一条能凑齐座位就下单。
#   price 票价（必须是该场真实存在的价位，可在选座页点“自检”看到全部价位）
#   qty   张数
#   areas 区域偏好，按顺序尝试；空 [] = 不限区域；
#         可以写字母 [A, B]，也可以写中文片段 ["一楼", "二楼"]（区域名字里含这个片段就算命中）
rules:
  - price: 100
    qty: 2
    areas: []
  - price: 180
    qty: 2
    areas: []
  - price: 480
    qty: 1
    areas: []

# —— 开票监控（可选，用在“演出详情页”上）——
# 开票瞬间详情页的场次按钮才会变可点，手动点很可能已经慢了。
# enabled: true 时，脚本会停在详情页盯着，目标场次一开卖就自动进入选座页，
# 再由上面的 rules 抢座（配合 autoRun: true 就是全自动）。
watch:
  enabled: false
  sessionId: ""         # 直接指定场次 id（最准，就是选座页 URL 里那串数字）
  date: ""              # 或按日期挑场次，如 "2026-09-20"
  time: ""              # 再按开演时间二次筛选，如 "19:30"
  startAt: ""           # 开抢时间(本机时间)，如 "2026-09-20 10:00:00"；留空 = 立刻开始盯
  pollMs: 800           # 轮询间隔(毫秒)
