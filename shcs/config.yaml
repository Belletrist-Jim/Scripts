# ============================================================
# 上海文化广场(shcstheatre.com) · 余票监控 / 开售提醒 配置
# 改完本文件后运行：  ./build.sh build
# 会生成 shcs.user.js —— 用油猴(Tampermonkey)安装一次即可。
#
# 说明：这个站的“选座页/订单页”必须登录才可见（未登录直接跳登录页），
# 所以先用 probe.user.js 在登录状态下把接口录一遍，我才能把“自动锁座”补齐。
# 本脚本现在做的是**公开接口就能做**的部分：盯余票、放票、开售，立刻提醒。
# ============================================================

programId: ""        # 演出 id（ProgramDetails.aspx?...&id=42089 里的 42089）。
                     # 留空 = 自动从当前页面 URL 读，只在你从别的页面看时才需要填。

pollMs: 20000        # 多久查一次（毫秒）。20000 = 20 秒；开票前可以调到 3000。
minSeats: 1          # 余票 ≥ 这个数才提醒（避免被 1~2 张的零头反复吵到）
notify: true         # 桌面通知 + 标题闪
sound: true          # 响铃
autoOpen: false      # true = 一放票就自动新开标签页到该场次的选座页（默认关，免得多开一堆）

# ============================================================
# 选座页（登录后的 /Program/SelectSeats.aspx?xz_program_id=..&xz_event_id=..）
# 这里的配置用于“自动抢座”。票面信息（区域/排/座/票价）都从选座页实时数据里读。
# ============================================================
dryRun: false        # true = 只预演(打印会挑哪些座)，绝不下单；抢票时保持 false
autoRun: true       # true = 选座页一打开就自动抢
maxRetry: 3          # 座位被别人抢走时，自动刷新重挑的轮数
jumpToCart: true     # 抢到（座位进购物车）后自动跳到结算页 OrderStep_First.aspx
autoCheckout: false   # 到购物车页后自动点「结算 Checkout」→ OrderStep_Second.aspx（结算页）
autoSubmitOrder: true   # 结算页：盯着「确认订购」按钮，一变成可点就立刻按下
                        # （这页按钮要等几秒才算完金额/名额，脚本不等你手点）
                        # 不想让它自动按就设 false
confirmPollMs: 150      # 盯按钮的间隔（毫秒）
confirmMaxWaitMs: 60000 # 最多等多久（毫秒），超时放弃并提示手动点
confirmMaxClicks: 2     # 最多自动按几次（按一次若 3 秒后还停在原页、按钮仍可点，才会再按一次）
                        # 想绝对不重复按就设 1
rowPreference: middle  # 同价位里的选排偏好：front(前排优先) / middle(中间排) / back(后排优先)

# 备选链：从上往下试，第一条能凑齐就锁
#   price 票价（选座页“库存”里能看到真实价位）
#   qty   张数
#   zones 区域名偏好，空 [] = 不限；可写片段，如 ["一楼","二楼"]（区域名形如“一楼观众厅”）
rules:
  - price: 80
    qty: 2
    zones: []
  - price: 280
    qty: 2
    zones: []
  - price: 480
    qty: 2
    zones: []
  - price: 680
    qty: 2
    zones: []
